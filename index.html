<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Omar Elmokadem</title>
<meta name="description" content="Computer science student at Qatar University and former Internal Audit and Cybersecurity intern at QatarEnergy LNG.">
<meta property="og:title" content="Omar Elmokadem">
<meta property="og:description" content="Computer science student at Qatar University and former Internal Audit and Cybersecurity intern at QatarEnergy LNG.">
<meta property="og:url" content="https://oelmokadem.me/">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0E1012">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2315181B'/%3E%3Cpath d='M8 11l5 5-5 5' fill='none' stroke='%23E58BA4' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M16 22h8' stroke='%23F2C879' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  /* Layout: deliberately single dark look. A command rail on the left, a shell session on the right; stacks on phones */
  :root {
    --bg: #0E1012; --term: #15181B; --fg: #E4E2DC; --muted: #8C918F; --line: #262A2E;
    --prompt: #E58BA4; --ok: #9FD3B4; --hl: #F2C879;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    --sans: "IBM Plex Sans", system-ui, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 400 1rem/1.6 var(--sans); padding-inline: 1rem; padding-block: 1.5rem 3rem; }
  a { color: var(--hl); text-underline-offset: 3px; }
  :focus-visible { outline: 2px solid var(--prompt); outline-offset: 2px; }

  .shell { max-width: 1280px; margin: 0 auto; display: grid; gap: 1.25rem; }
  .rail h1 { margin: 0; font-size: clamp(2rem, 4.5vw, 3.25rem); line-height: 1.05; font-weight: 700; letter-spacing: -.02em; }
  .rail p { margin: .75rem 0 0; color: var(--muted); max-width: 32rem; }
  .role { margin-top: 1.25rem; padding: .875rem 1rem; border: 1px solid var(--line); border-left: 3px solid var(--hl); border-radius: 10px; background: var(--term); display: grid; gap: .125rem; max-width: 32rem; }
  .role-k { font: 500 .8125rem var(--mono); color: var(--hl); }
  .role strong { font-weight: 700; font-size: 1.0625rem; line-height: 1.35; }
  .role span:last-child { color: var(--muted); font-size: .9375rem; }
  .cmds { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: 1.25rem; }
  .cmds button { font: 500 .9375rem var(--mono); color: var(--fg); background: var(--term); border: 1px solid var(--line); border-radius: 8px; padding: .5rem .8rem; cursor: pointer; }
  .cmds button:hover { border-color: var(--prompt); color: var(--prompt); }
  .direct { margin-top: 1.25rem; display: flex; flex-wrap: wrap; gap: .5rem 1.25rem; font-weight: 600; }

  .term { background: var(--term); border: 1px solid var(--line); border-radius: 14px; min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
  .bar { display: flex; align-items: center; gap: .5rem; padding: .7rem 1rem; border-bottom: 1px solid var(--line); font: 500 .8125rem var(--mono); color: var(--muted); }
  .dots { display: flex; gap: .375rem; margin-right: .5rem; }
  .dots i { width: .7rem; height: .7rem; border-radius: 50%; background: var(--line); }
  .out { padding: 1rem 1.1rem; font: 400 .9375rem/1.65 var(--mono); overflow-wrap: anywhere; min-height: 24rem; overflow-y: auto; }
  .out .p { color: var(--prompt); }
  .out .c { color: var(--fg); font-weight: 600; }
  .out .dim { color: var(--muted); }
  .out .ok { color: var(--ok); }
  .out .h { color: var(--hl); font-weight: 600; }

  .block { margin: 0 0 1.5rem; }
  .cmdline { margin: 0 0 .5rem; }
  .entry { margin: 0 0 1.125rem; }
  .entry:last-child { margin-bottom: 0; }
  .entry .sub { margin: .125rem 0 0; color: var(--muted); }
  .entry .desc { margin: .25rem 0 0; padding-left: 2ch; border-left: 1px solid var(--line); }
  .entry .desc p { margin: 0; }
  .entry .meta { margin: .375rem 0 0; padding-left: 2ch; color: var(--muted); }
  .entry .go { margin: .25rem 0 0; padding-left: 2ch; display: flex; flex-wrap: wrap; gap: 0 1.5rem; }
  .kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 0 2ch; }

  .in { display: flex; gap: .6rem; align-items: center; padding: .75rem 1.1rem; border-top: 1px solid var(--line); font: 400 .9375rem var(--mono); }
  .in label { color: var(--prompt); white-space: nowrap; }
  .in input { flex: 1; min-width: 0; background: transparent; border: 0; color: var(--fg); font: inherit; outline: none; caret-color: var(--prompt); }

  @media (min-width: 960px) {
    body { padding-block: 3rem 4rem; }
    .shell { grid-template-columns: minmax(0, 4fr) minmax(0, 7fr); gap: 2.5rem; align-items: start; }
    .rail { position: sticky; top: 3rem; }
    .cmds { flex-direction: column; align-items: flex-start; }
    .out { min-height: 34rem; max-height: calc(100vh - 12rem); }
  }
</style>

</head>
<body>
<div class="shell">
  <aside class="rail">
    <h1>Omar Elmokadem</h1>
    <p>Computer science student in Qatar University's Honors Program, focused on cybersecurity and IT audit.</p>
    <div class="role">
      <span class="role-k">Latest role</span>
      <strong>Summer Intern, Internal Audit and Cybersecurity</strong>
      <span>QatarEnergy LNG, June to July 2026</span>
    </div>
    <div class="cmds" id="cmds"></div>
    <div class="direct">
      <a href="/cv.pdf">Download CV</a>
      <a href="https://github.com/oelmokadem">GitHub</a>
      <a href="https://www.linkedin.com/in/oelmokadem">LinkedIn</a>
    </div>
  </aside>

  <section class="term" aria-label="Terminal">
    <div class="bar"><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>omar@oelmokadem.me: ~</div>
    <div class="out" id="out" aria-live="polite"></div>
    <form class="in" id="form">
      <label for="cmd">omar@qu:~$</label>
      <input id="cmd" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="type help, or pick a command">
    </form>
  </section>
</div>

<noscript>
  <p style="max-width:1280px;margin:1rem auto">Projects: ACM Banner Redesign (Chrome extension), Mizan: Islamic Habit Tracker (App Store), Homelab, Automated notification system.
  Contact: omarsamirelmokadem@gmail.com</p>
</noscript>

<script>
  var CV_URL = "/cv.pdf";
  var out = document.getElementById("out");

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function link(href, text) { return '<a href="' + href + '">' + esc(text) + "</a>"; }
  function entry(o) {
    var h = '<div class="entry"><div><span class="h">' + esc(o.name) + "</span>" + (o.when ? '  <span class="dim">' + esc(o.when) + "</span>" : "") + "</div>";
    if (o.sub) h += '<div class="sub">' + esc(o.sub) + "</div>";
    h += '<div class="desc">' + o.desc.map(function (d) { return "<p>" + d + "</p>"; }).join("") + "</div>";
    if (o.links) h += '<div class="go">' + o.links.join("") + "</div>";
    if (o.stack) h += '<div class="meta">stack: ' + esc(o.stack) + "</div>";
    return h + "</div>";
  }

  var C = {
    whoami: function () {
      return entry({ name: "Omar Elmokadem", sub: "Computer science student, Qatar University",
        desc: ["Summer Intern, Internal Audit and Cybersecurity at QatarEnergy LNG (2026).",
               "BSc Computer Science, College of Engineering. Honors Program, GPA 3.93 / 4.00.",
               "Tech Team member, " + link("https://qu.acm.org/", "ACM QU Chapter") + "."] });
    },
    projects: function () {
      return [
        entry({ name: "acm-banner/", sub: "ACM Banner Redesign. Chrome extension",
          desc: ["A Chrome extension for the ACM QU Chapter that restyles Qatar University's myBanner portal.",
                 "Two themes (QU maroon and ACM mint), light and dark modes, English and Arabic. Open source under MIT."],
          links: [link("https://chromewebstore.google.com/detail/jlkacmjcffobfchlhmeeifpgefkaifcn", "Chrome Web Store")],
          stack: "JavaScript, CSS" }),
        entry({ name: "mizan/", sub: "Mizan: Islamic Habit Tracker. Mobile app",
          desc: ["A mobile app for tracking daily Islamic habits.",
                 '<span class="ok">Live on the App Store.</span> <span class="dim">Android version in closed beta on Google Play.</span>'],
          links: [link("https://apps.apple.com/us/app/mizan-islamic-tracker/id6768990599", "App Store")],
          stack: "Expo, React Native, MongoDB Atlas" }),
        entry({ name: "homelab/", sub: "Self-hosted home server",
          desc: ["A Proxmox server running self-hosted services in Docker, secured behind Cloudflare and Nginx Proxy Manager."],
          stack: "Proxmox VE, Docker, Nginx Proxy Manager, Cloudflare" }),
        entry({ name: "notifier/", sub: "Automated notification system",
          desc: ["Watches an online platform for updates and sends real-time alerts to Discord and WhatsApp.",
                 "Scheduled on Azure Functions, with error handling and status logging."],
          stack: "Python, Azure Functions, Discord webhooks" })
      ].join("");
    },
    experience: function () {
      return entry({ name: "QatarEnergy LNG", when: "Jun to Jul 2026", sub: "Summer Intern, Internal Audit and Cybersecurity",
          desc: ['<span class="ok">Internal Audit</span> <span class="dim">3 weeks</span>',
                 "Worked on internal IT audit engagements covering Information Risk Management and the Security and Network Operations Centres.",
                 "Reviewed departmental risk assessments and drafted audit questions from them to support the audit of a department.",
                 "Cross-referenced controls against ISO/IEC 27002:2022 and NIST CSF 2.0.",
                 '<br><span class="ok">Cybersecurity</span> <span class="dim">1 week</span>',
                 "Gained hands-on experience with Burp Suite under the guidance of the security team."],
          stack: "ISO/IEC 27002:2022, NIST CSF 2.0, Burp Suite, Excel" }) +
        entry({ name: "ACM QU Chapter", sub: "Tech Team member",
          desc: ["Builds tools for the chapter, including the ACM Banner Redesign extension."],
          links: [link("https://qu.acm.org/", "qu.acm.org")] });
    },
    awards: function () {
      return entry({ name: "1st place", when: "Aug 2025", sub: "Microsoft x Qatar Scientific Club Summer Data Camp",
          desc: ["Five-day data and AI program. Built insights from Qatar Open Data Portal datasets with Power BI and AI models."] }) +
        entry({ name: "3rd place", when: "Nov to Dec 2025", sub: "Qatar University Health Tech Hackathon",
          desc: ["Developed a health-tech project and presented it to judges at World Summit AI Qatar."] });
    },
    contact: function () {
      return '<div class="kv">' +
        '<span class="dim">email</span><span>' + link("mailto:omarsamirelmokadem@gmail.com", "omarsamirelmokadem@gmail.com") + "</span>" +
        '<span class="dim">github</span><span>' + link("https://github.com/oelmokadem", "github.com/oelmokadem") + "</span>" +
        '<span class="dim">linkedin</span><span>' + link("https://www.linkedin.com/in/oelmokadem", "linkedin.com/in/oelmokadem") + "</span>" +
        '<span class="dim">cv</span><span>' + link(CV_URL, "Download CV (PDF)") + "</span></div>";
    },
    help: function () {
      return "commands: " + ["experience", "projects", "whoami", "awards", "contact", "clear"].map(function (k) { return '<span class="c">' + k + "</span>"; }).join("  ");
    },
    clear: function () { out.innerHTML = ""; return null; }
  };

  function run(cmd, opts) {
    cmd = (cmd || "").trim().toLowerCase();
    if (!cmd) return;
    var body = C.hasOwnProperty(cmd) ? C[cmd]() : '<span class="dim">command not found: ' + esc(cmd) + ". Try help.</span>";
    if (body === null) return;
    var d = document.createElement("div"); d.className = "block";
    d.innerHTML = '<div class="cmdline"><span class="p">omar@qu:~$ </span><span class="c">' + esc(cmd) + "</span></div>" + body;
    out.appendChild(d);
    if (!opts || !opts.quiet) d.scrollIntoView({ block: "nearest" }), out.scrollTop = d.offsetTop - out.offsetTop - 8;
  }

  var cmds = document.getElementById("cmds");
  ["experience", "projects", "whoami", "awards", "contact"].forEach(function (k) {
    var b = document.createElement("button"); b.type = "button"; b.textContent = "$ " + k;
    b.addEventListener("click", function () { run(k); }); cmds.appendChild(b);
  });
  document.getElementById("form").addEventListener("submit", function (e) {
    e.preventDefault(); var i = document.getElementById("cmd"); run(i.value); i.value = "";
  });

  try { if (/[?&]via=nfc/.test(location.search)) history.replaceState(null, "", location.pathname); } catch (e) {}
  ["whoami", "experience"].forEach(function (k) { run(k, { quiet: true }); });
  out.scrollTop = 0;
</script>

</body>
</html>
