name: Deploy static site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_retry_1.outputs.page_url || steps.deploy_retry_2.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Retry deploy (attempt 2)
        if: ${{ steps.deploy.outcome == 'failure' }}
        id: deploy_retry_1
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Retry deploy (attempt 3)
        if: ${{ steps.deploy.outcome == 'failure' && steps.deploy_retry_1.outcome == 'failure' }}
        id: deploy_retry_2
        uses: actions/deploy-pages@v5

